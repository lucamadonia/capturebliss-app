name: Chrome Extension Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "ext-v*.*.*"

env:
  NODE_VERSION: "18"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: workspace/yarn.lock

      - name: Install dependencies
        working-directory: workspace
        run: yarn install --frozen-lockfile

      - name: Build common
        working-directory: workspace/packages/common
        run: yarn build

      - name: Build extension
        working-directory: workspace/packages/ext-tour
        run: yarn build

      - name: Package extension
        working-directory: workspace/packages/ext-tour
        run: |
          mkdir -p release
          cd dist && zip -r ../release/capturebliss-extension.zip .

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: workspace/packages/ext-tour/release/capturebliss-extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
